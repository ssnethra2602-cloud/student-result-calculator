<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Result Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <span class="navbar-brand">Result Calculator</span>
  </div>
</nav>

<!-- Main Container -->
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <!-- Card -->
      <div class="card shadow">
        <div class="card-body">
          <h5 class="card-title text-center">Enter Marks</h5>

          <input type="number" id="m1" class="form-control mb-2" placeholder="Subject 1">
          <input type="number" id="m2" class="form-control mb-2" placeholder="Subject 2">
          <input type="number" id="m3" class="form-control mb-2" placeholder="Subject 3">

          <button class="btn btn-primary w-100" onclick="calculate()">Calculate</button>
        </div>
      </div>

      <!-- Alert -->
      <div id="alertBox" class="alert alert-success mt-3 d-none"></div>

      <!-- Button to open modal -->
      <button class="btn btn-secondary w-100 mt-2" data-bs-toggle="modal" data-bs-target="#resultModal">
        View Saved Result
      </button>

    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="resultModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Saved Result</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="savedResult">
        No data found
      </div>
    </div>
  </div>
</div>

<script>
function calculate() {
  let m1 = Number(document.getElementById("m1").value);
  let m2 = Number(document.getElementById("m2").value);
  let m3 = Number(document.getElementById("m3").value);

  let total = m1 + m2 + m3;
  let percentage = (total / 300) * 100;
  let result = percentage >= 40 ? "Pass" : "Fail";

  let output = `
    Total: ${total}<br>
    Percentage: ${percentage.toFixed(2)}%<br>
    Result: ${result}
  `;

  document.getElementById("alertBox").innerHTML = output;
  document.getElementById("alertBox").classList.remove("d-none");

  localStorage.setItem("studentResult", output);
  document.getElementById("savedResult").innerHTML =
    localStorage.getItem("studentResult");
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
